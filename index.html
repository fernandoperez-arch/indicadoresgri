<!DOCTYPE html>
<html lang="pt">
<head>
  <meta charset="UTF-8">
  <title>Guia Interativo GRI</title>
  <style>
    :root { --primary: #1b4332; --accent: #2d6a4f; --bg: #f8f9fa; }
    body { font-family: system-ui, sans-serif; background: var(--bg); margin: 0; padding: 14px; color: #212529; }
    .header { background: linear-gradient(135deg, var(--primary), var(--accent)); color: #fff; padding: 16px 20px; border-radius: 10px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; }
    .badge { background: rgba(255,255,255,0.2); padding: 5px 12px; border-radius: 20px; font-size: 0.8rem; font-weight: 600; }
    .tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .tab-btn { background: #e9ecef; border: none; padding: 8px 14px; border-radius: 6px; cursor: pointer; font-weight: 600; color: #495057; }
    .tab-btn.active { background: var(--primary); color: #fff; }
    .card { background: #fff; border-radius: 10px; padding: 16px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border-left: 5px solid var(--accent); }
    .req-box { background: #edf6f9; padding: 12px; border-radius: 6px; margin: 10px 0; border: 1px solid #cce3de; }
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .tip-box { background: #fff3cd; padding: 12px; border-radius: 6px; border: 1px solid #ffecb5; }
    .ex-box { background: #d8f3dc; padding: 12px; border-radius: 6px; border: 1px solid #b7e4c7; }
    .evidencias { margin-top: 12px; background: #fff; padding: 12px 16px; border-radius: 10px; border: 1px dashed var(--accent); font-size: 0.9rem; }
  </style>
</head>
<body>
<div id="app">A carregar modelo interativo GRI...</div>
<script>
  async function init() {
    const id = new URLSearchParams(window.location.search).get('id') || '3-3';
    const res = await fetch('gri_database.json');
    const db = await res.json();
    const item = db[id];
    if (!item) { document.getElementById('app').innerHTML = 'Indicador não encontrado no JSON.'; return; }
    window.currentItem = item;
    const tabsHtml = item.alineas.map((al, i) => `<button class="tab-btn ${i===0?'active':''}" onclick="showTab(${i})">Alínea ${al.id.replace('_','.')}</button>`).join('');
    const evHtml = item.evidencias_sugeridas.map(e => `<span style="margin-right:14px;">✅ ${e}</span>`).join('');
    document.getElementById('app').innerHTML = `
      <div class="header">
        <div><small>${item.norma}</small><h3 style="margin:2px 0 0 0;">Conteúdo ${item.codigo}: ${item.titulo}</h3></div>
        <span class="badge">${item.permite_omissao ? 'Permite Omissão Justificada' : 'Obrigatório Sem Omissão'}</span>
      </div>
      <div class="tabs">${tabsHtml}</div>
      <div id="tab-content" class="card"></div>
      <div class="evidencias"><strong>📎 Evidências sugeridas:</strong> ${evHtml}</div>
    `;
    showTab(0);
  }
  function showTab(i) {
    const al = window.currentItem.alineas[i];
    document.querySelectorAll('.tab-btn').forEach((b, idx) => b.classList.toggle('active', idx === i));
    document.getElementById('tab-content').innerHTML = `
      <h4 style="margin:0; color:#1b4332;">${al.rotulo}</h4>
      <div class="req-box"><small style="font-weight:700; color:#1b4332;">REQUISITO OBRIGATÓRIO ("DEVERÁ"):</small><p style="margin:4px 0 0 0; font-weight:600;">${al.requisito_devera}</p></div>
      <div class="grid-2">
        <div class="tip-box"><strong>💡 Como preencher:</strong><p style="margin:4px 0 0 0; font-size:0.9rem;">${al.dica_ludica}</p></div>
        <div class="ex-box"><strong>📝 Exemplo modelo:</strong><p style="margin:4px 0 0 0; font-size:0.9rem; font-style:italic;">"${al.exemplo_preenchimento}"</p></div>
      </div>
    `;
  }
  init();
</script>
</body>
</html>
